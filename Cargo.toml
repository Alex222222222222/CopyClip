[package]
edition = "2021"
name = "copy_clip_ui"
version = "0.3.9"
license = "MIT"
rust-version = "1.78"

[package.metadata.i18n]
load-path = "locales"
default-language = "en-GB"
available-locales = ["en-GB", "zh-CN", "en", "de"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
rust-i18n = "3.1"
chrono = "0.4"
js-sys = "0.3"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
sublime_fuzzy = "0.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
once_cell = "1.19"
web-sys = { version = "0.3", features = [
  "Document",
  "Element",
  "HtmlElement",
  "Node",
  "Window",
  "MediaQueryList",
  "DomTokenList",
] }
yew = { version = "0.23", features = ["csr"] }
yewdux = "0.13"
yew-router = "0.20"
yew_icons = { version = "0.10", features = [
  "bootstrap",
  "heroicons_outline",
  "lucide"
] }
# for logging
tauri-plugin-logging = {path = "./tauri-plugin-logging", features = ["api"]}
clip = {path = "./src-clip", features = ["yew"]}

[profile.release]
# less code to include into binary
panic = 'abort'
# optimization over all codebase ( better optimization, slower build )
codegen-units = 1
# optimization for size ( more aggressive )
opt-level = 'z'
# optimization for size
# opt-level = 's'
# link time optimization using whole-program analysis
lto = true

[workspace]
members = [
  "src-tauri",
  "src-clip",
  "tauri-plugin-logging"
]
